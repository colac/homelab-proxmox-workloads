# mise — pinned tools, environment and tasks for the workloads layer.
#
#   mise trust && mise install      # once per clone (and after editing this file)
#   mise run setup                  # venv deps, collections, node tools, git hooks
#   mise tasks                      # everything you can run
#
# Every app task takes the app first; arguments after it go straight to the
# tool, quoting intact:
#
#   mise run tf nextcloud plan
#   mise run play nextcloud playbooks/10-nextcloud.yml --check --diff
#
# Secrets are NOT loaded into your shell. .mise/sops-exec decrypts for one
# command: Terraform gets the infrastructure credentials from ./secrets.yaml,
# Ansible gets only that app's from <app>/secrets.yaml. Neither sees the other.
# Per-machine overrides go in mise.local.toml (git-ignored).
min_version = "2026.1.0"

[tools]
# Same pins as the core repo — bump them together.
terraform = "1.15.7"
terraform-docs = "0.21.0"
tflint = "0.63.1"
trivy = "0.71.2"
shellcheck = "0.11.0"
sops = "3.13.3"
age = "1.3.2"
# ansible-core 2.17 supports controller Python 3.10–3.12 only.
python = "3.12"
node = "26.4.0"

[env]
_.python.venv = { path = ".venv", create = true }
_.path = ["{{config_root}}/node_modules/.bin"]
# Not a secret — the hypervisor's address is, and lives in secrets.yaml.
PROXMOX_TLS_INSECURE = "false"
# sops opens decrypted files in VS Code, for `mise run secrets:edit` and for
# bare `sops` in a mise-activated shell. Set here so the repo decides, not
# whatever EDITOR a given terminal happens to have. --wait is load-bearing:
# without it `code` returns at once and sops re-encrypts the unedited file.
SOPS_EDITOR = "code --wait"
# Where `deps:dev` finds the core repo. Override in mise.local.toml.
HOMELAB_CORE_DIR = "{{config_root}}/../homelab-proxmox"

# --------------------------------------------------------------------------
# Setup and checks
# --------------------------------------------------------------------------
[tasks.setup]
description = "Install Python/Node deps, git hooks, tflint plugins, then each app's pinned Ansible collections"
run = [
  "pip install -q --upgrade pip",
  "pip install -q -r requirements.txt",
  "npm ci --silent",
  "pre-commit install --hook-type pre-commit --hook-type commit-msg",
  "tflint --init",
  # Last, so everything above is in place even when it fails — it needs the
  # pinned core tag to exist on GitHub. Until then: `mise run deps:dev`.
  { task = "deps" },
]

[tasks.deps]
description = "Install every app's ansible/requirements.yml — colac.homelab at its pinned core tag, plus Galaxy collections"
# --force: a git-sourced collection is "already installed" whenever its
# galaxy.yml version matches, even if the pinned tag moved.
run = '''
for d in */ansible/; do
  echo "== ${d%%/*}"
  (cd "$d" && ansible-galaxy collection install --force -r requirements.yml) || exit 1
done
'''

[tasks."deps:dev"]
description = "Like deps, but colac.homelab from the sibling core checkout instead of the pinned tag"
run = '''
echo "Using colac.homelab from $HOMELAB_CORE_DIR/ansible — 'mise run deps' restores the pin."
dev_req=$(mktemp --suffix=.yml)
trap 'rm -f "$dev_req"' EXIT
for d in */ansible/; do
  echo "== ${d%%/*}"
  # requirements.yml minus the git-sourced entry (the tag may not exist yet).
  python -c 'import sys, yaml; r = yaml.safe_load(open(sys.argv[1])); r["collections"] = [c for c in r["collections"] if c.get("type") != "git"]; yaml.safe_dump(r, sys.stdout)' "$d/requirements.yml" >"$dev_req"
  (cd "$d" && ansible-galaxy collection install -r "$dev_req" && ansible-galaxy collection install --force "$HOMELAB_CORE_DIR/ansible") || exit 1
done
'''

[tasks.lint]
description = "Every pre-commit hook on every file, then ansible-lint per app"
run = ["pre-commit run --all-files", { task = "lint:ansible" }]

[tasks."lint:ansible"]
description = "ansible-lint (production profile) + syntax-check, for every app with ansible/"
run = 'for d in */ansible/; do echo "== ${d%%/*}"; .mise/app lint "${d%%/*}" || exit 1; done'

[tasks."tf:validate"]
description = "terraform fmt + validate every app's project (no backend, no credentials)"
# Per app, never from the root: a recursive fmt there would descend into the
# Ansible collections `mise run setup` installs under */ansible/collections.
run = '''
for d in */terraform/; do
  echo "== ${d%%/*}"
  (cd "$d" && terraform fmt -check -recursive && terraform init -backend=false -input=false >/dev/null && terraform validate) || exit 1
done
'''

[tasks."release:dry-run"]
description = "Show the version semantic-release would cut next"
run = "semantic-release --no-ci --dry-run"

# --------------------------------------------------------------------------
# Secrets
# --------------------------------------------------------------------------
[tasks."secrets:edit"]
description = "Edit a secrets file in VS Code: no argument = infra (./secrets.yaml), or an app name"
# mise appends arguments to the run line; `bash -c '…' name` turns them into
# positional parameters, so "$1" is the app (or nothing).
run = """bash -c 'sops "${1:+$1/}secrets.yaml"' secrets:edit"""
# Hand the terminal straight to sops and its editor (SOPS_EDITOR in [env]).
# Without it mise sits between them.
raw = true

[tasks."secrets:check"]
description = "Verify every secrets file has the keys its consumer needs (names only, never values)"
run = [
  ".mise/sops-exec --check terraform",
  ".mise/sops-exec --check nextcloud",
]

# --------------------------------------------------------------------------
# Per-app tasks (see .mise/app)
# --------------------------------------------------------------------------
[tasks.tf]
description = "terraform in an app's project: mise run tf <app> init|plan|apply|state list …"
run = "{{config_root}}/.mise/app tf"

[tasks.play]
description = "ansible-playbook with the app's credentials: mise run play <app> playbooks/site.yml --check"
run = "{{config_root}}/.mise/app play"

[tasks.inventory]
description = "Show an app's inventory (no credentials): mise run inventory <app>"
run = "{{config_root}}/.mise/app inventory"

[tasks.ping]
description = "SSH reachability of an app's hosts: mise run ping <app>"
run = "{{config_root}}/.mise/app ping"
