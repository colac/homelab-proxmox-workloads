---
# Redeploy the Nextcloud host, in order.
#
#   mise run play nextcloud playbooks/site.yml
#
# `mise run play nextcloud` hands ansible-playbook the credentials from
# nextcloud/secrets.yaml for that one run — no vault password, no -e flag.
#
# Its Elastic Agent is NOT enrolled from here: the monitoring repo owns
# observability for every host and lists this one as an agent target.
- name: Preflight
  import_playbook: 00-bootstrap.yml
- name: Nextcloud
  import_playbook: 10-nextcloud.yml
