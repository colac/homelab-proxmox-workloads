---
- name: Configure the Nextcloud host
  hosts: nextcloud
  become: true
  gather_facts: true
  pre_tasks:
    - name: Assert the public domain is provided
      ansible.builtin.assert:
        that:
          - nextcloud_domain is defined
          - nextcloud_domain | length > 0
        fail_msg: >-
          nextcloud_domain is not set. It comes from the environment
          (NEXTCLOUD_DOMAIN, passed by `mise run play nextcloud …` from the
          SOPS-encrypted nextcloud/secrets.yaml) so the hostname stays out of
          the tracked repo. Set nextcloud_domain with
          `mise run secrets:edit nextcloud`, and run through mise rather than
          calling ansible-playbook bare.
          Caddy and AIO both need it.
        quiet: true
  roles:
    - role: tailscale
    - role: nextcloud_aio
    - role: reverse_proxy
